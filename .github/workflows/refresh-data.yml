# Weekly (or run manually): rebuild cable/pipeline layers incl. OpenStreetMap power cables via Overpass, and the
# sanctions watchlist; commit if changed. The Pages job picks the new data up on its next 15-min run.
name: refresh-data
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run fetch:static
      - run: npm run fetch:watchlist
      - run: npm run eval
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data server/data scripts/cache/osm-power-cables.json 2>/dev/null || git add web/public/data server/data
          git diff --cached --quiet || (git commit -m "Weekly data refresh" && git push)
