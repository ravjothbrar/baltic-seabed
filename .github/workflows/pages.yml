# Free hosting: builds the site in browser mode and deploys it to GitHub Pages.
# Runs on every push to main and every 15 min. Each scheduled run samples ~10 min of live AIS and
# extends data/history.json, so visitors see 6 h of track history the moment the page opens.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci && npm ci --prefix web
      - name: Build site
        run: npm --prefix web run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Extend track history
        run: node --no-warnings scripts/build-history.mjs web/dist/data/history.json
        env:
          PREV_URL: ${{ steps.pages.outputs.base_url }}/data/history.json
          SAMPLES: ${{ github.event_name == 'schedule' && '10' || '1' }}
      - run: cp server/data/watchlist.json web/dist/data/watchlist.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
