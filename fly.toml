app = "baltic-seabed-watch"
primary_region = "arn"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "seabed_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
